name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download FFmpeg and Deno
        shell: pwsh
        run: ./packaging/fetch_tools.ps1

      - name: Build ViralClipper.exe
        shell: pwsh
        run: |
          python packaging/make_icon.py
          pyinstaller --noconfirm --clean packaging/viral_clipper.spec
          Copy-Item -Recurse packaging/bin dist/ViralClipper/bin
          Copy-Item README.md dist/ViralClipper/README.md
          "{0:N0} MB" -f ((Get-ChildItem dist/ViralClipper -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: End-to-end test of the .exe
        id: smoke
        shell: pwsh
        run: ./packaging/smoke_test.ps1 -Exe dist/ViralClipper/ViralClipper.exe

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
          Compress-Archive -Path dist/ViralClipper -DestinationPath "dist/ViralClipper-Portable-$env:APP_VERSION.zip"
          Get-ChildItem dist -File | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ViralClipper-${{ env.APP_VERSION }}
          path: |
            dist/ViralClipper-Setup-*.exe
            dist/ViralClipper-Portable-*.zip

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $yt = "${{ steps.smoke.outputs.youtube }}"
          $notes = @"
          **Download ``ViralClipper-Setup-$env:APP_VERSION.exe``**, run it, and Viral Clipper opens in your browser.
          No Python or FFmpeg needed. Everything is included.

          - Windows 10/11, 64-bit
          - The first video you process downloads the speech model (~500 MB, one time)
          - Add your Anthropic API key in Settings so Claude picks the clips
          - ``ViralClipper-Portable`` zip: same app without installing. Unzip and run ``ViralClipper.exe``

          Automated test on this build: link + upload clips passed; YouTube download test: $yt.
          "@
          gh release create "v$env:APP_VERSION" (Get-ChildItem dist/ViralClipper-Setup-*.exe).FullName `
            (Get-ChildItem dist/ViralClipper-Portable-*.zip).FullName `
            --title "Viral Clipper $env:APP_VERSION" --notes $notes --latest
